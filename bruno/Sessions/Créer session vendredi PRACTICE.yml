info:
  name: Créer session vendredi PRACTICE
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_url}}/sessions"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "day": "FRIDAY",
        "type": "PRACTICE",
        "date": "2026-07-17T10:00:00",
        "priceMultiplier": null
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
