info:
  name: Créer spectateur sans fidélité
  type: http
  seq: 3

http:
  method: POST
  url: "{{api_url}}/spectators"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Bob Dupont",
        "email": "bob@example.com",
        "birthDate": "1995-06-20",
        "loyaltyTier": null
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
