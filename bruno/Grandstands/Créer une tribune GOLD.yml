info:
  name: Créer une tribune GOLD
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_url}}/grandstands"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Tribune Sainte-Beaume",
        "location": "Virage 3",
        "category": "GOLD",
        "capacity": 200,
        "basePrice": 180.0,
        "covered": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
