info:
  name: Filtrer par catégorie GOLD
  type: http
  seq: 4

http:
  method: GET
  url: "{{api_url}}/grandstands?category=GOLD"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: category
      value: GOLD
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
